name: Refresh data

# The pages embed a mainnet snapshot, so a committed snapshot is always aging.
# This workflow is why it does not go stale: it re-scans all 925 official xStocks
# mints, regenerates the feed and both pages, commits any change, and redeploys.
#
# Every 6 hours: xStocks dividend activations land at 00:30 UTC daily, so this
# catches them within a quarter day at most. Also runnable on demand.
#
# The deploy step is conditional on the VERCEL_TOKEN secret: until it is added
# the refresh still commits fresh data, and the manual deploy stays the way the
# site is updated. Once the secret exists, the loop closes with no human step.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Re-scan all official mints
        run: node scripts/scan-xstocks.mjs

      - name: Regenerate feed, pages, and site
        run: |
          node scripts/risk-feed.mjs
          node scripts/gen-webdata.mjs
          node scripts/build-site.mjs

      - name: Fail if the regenerated summary disagrees with the feed
        # A scan that silently produced 0 tokens or wrong stats would deploy a
        # confidently wrong page. This is the tripwire.
        run: |
          node -e "
          const feed = require('./feed/owed-risk.json');
          const scan = require('./keeper/data/xstocks-scan.json');
          if (feed.tokens.length !== scan.results.length) {
            throw new Error('feed/scan token count mismatch');
          }
          if (scan.results.length < 900) {
            throw new Error('scan lost tokens: ' + scan.results.length);
          }
          console.log('fresh snapshot:', scan.results.length, 'mints,', feed.summary.trap, 'stale');
          "

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "Sithu Nyein"
          git config user.email "sithunyein.mailto@gmail.com"
          # README.md belongs in this list: gen-webdata regenerates the derived
          # numbers in it, so omitting it left the README advertising an older
          # classification time than the feed and the board it describes.
          git add keeper/data feed web shared/vectors README.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "snapshot unchanged"
          else
            git commit -m "Refresh mainnet snapshot (scheduled)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.commit.outputs.changed == 'true'
        run: git push

      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          cd site
          # The production domain owed.sithunyein.com belongs to the Vercel project
          # "owed". Link explicitly (ignoring any org/project env override) so a
          # stale project id can never deploy into a project the domain does not
          # serve - which silently leaves the live site on an old snapshot.
          env -u VERCEL_PROJECT_ID -u VERCEL_ORG_ID \
            vercel link --yes --project owed --token "$VERCEL_TOKEN"
          vercel deploy --prod --yes --token "$VERCEL_TOKEN"

  # A refreshed snapshot only helps anyone if the domain actually serves it.
  # This job exists because that silently stopped being true: the refresh
  # committed fresh data while the live site stayed on a five-hour-old
  # snapshot, and nothing went red. A stale board is worse than no board, so
  # this compares the deployed page against the committed feed and fails.
  freshness:
    name: Live site is not stale
    runs-on: ubuntu-latest
    needs: refresh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compare the deployed snapshot against the committed one
        run: |
          node -e "
          const https = require('https');
          const get = (url) => new Promise((ok, no) => https.get(url, (r) => {
            let b = ''; r.on('data', (c) => b += c); r.on('end', () => ok(b));
          }).on('error', no));
          const feed = require('./feed/owed-risk.json');
          const committed = Date.parse(feed.generatedAt);
          (async () => {
            const html = await get('https://owed.sithunyein.com/?cb=' + Date.now());
            const m = html.match(/\"generatedAt\":\"([^\"]+)\"/);
            if (!m) throw new Error('live page carries no embedded snapshot');
            const live = Date.parse(m[1]);
            const hours = (committed - live) / 3.6e6;
            console.log('committed:', feed.generatedAt, '| deployed:', m[1]);
            if (hours > 2) {
              throw new Error('the live site is ' + hours.toFixed(1) + 'h behind the committed feed.\n' +
                'The domain only updates on deploy. Either:' +
                '  (a) add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repo secrets so the' +
                '      Deploy step above runs, or' +
                '  (b) connect the GitHub repo to the Vercel project (root vercel.json already' +
                '      sets buildCommand/outputDirectory), so every push deploys.');
            }
            console.log('ok: deployed snapshot is current');
          })().catch((e) => { console.error(e.message); process.exit(1); });
          "
