name: Deploy registry to devnet

# Manual only. This is the path to the one artifact still missing from the
# submission: a transaction signature from a real corporate action settled on
# devnet. It cannot be produced on Windows dev machines — there is no
# `cargo-build-sbf`, and the Solana toolchain is Linux/macOS only — so it runs
# here, where the toolchain works.
#
# Setup state (2026-09-22):
#
#   The SOLANA_KEYPAIR secret IS set, from a devnet keypair generated for this
#   repository. The keypair file lives at ~/.config/solana/owed-devnet.json on
#   the machine that generated it — keep it, because the upgrade authority for
#   the deployed program is this key, and GitHub secrets cannot be read back.
#
#   The remaining step is funding, and only the owner can do it:
#
#     1. Go to https://faucet.solana.com (Devnet), paste the wallet address
#        printed by the "Restore wallet" step, and request SOL. Repeat until the
#        wallet holds ~4 SOL: the measured requirement is 3.61 SOL (1.78 SOL of
#        rent for ProgramData plus the same for the buffer, which is returned on
#        success). The preflight step below prints the exact figure for the
#        artifact it just built.
#        (`solana airdrop` from a laptop or runner is usually rate-limited with
#        429s; the web faucet is the practical path.)
#
#     2. Run this workflow. It builds, deploys to the pinned program address, runs
#        the end-to-end settlement test against devnet, and writes the program id
#        plus every transaction signature — with explorer links — into the run
#        summary and as the `devnet-deployment` artifact.
#
#   To use a different wallet instead, replace the secret:
#       gh secret set SOLANA_KEYPAIR < your-funded-devnet-keypair.json
#
# Nothing here runs on a push: deploying is a deliberate act.

on:
  workflow_dispatch:
    inputs:
      run_settlement_test:
        description: "Also run tests/owed.mjs (settles a 4:1 split end to end)"
        type: boolean
        default: true

jobs:
  deploy:
    name: Build, deploy, settle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor 0.31.2 (pinned prebuilt)
        run: |
          # Bare binary asset, and the repo moved: coral-xyz/anchor now
          # redirects to otter-sec/anchor.
          curl -sSfL -o anchor \
            https://github.com/otter-sec/anchor/releases/download/v0.31.2/anchor-0.31.2-x86_64-unknown-linux-gnu
          chmod +x anchor
          sudo mv anchor /usr/local/bin/anchor
          anchor --version

      - name: Restore wallet from SOLANA_KEYPAIR
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}
        run: |
          if [ -z "$SOLANA_KEYPAIR" ]; then
            echo "::error::SOLANA_KEYPAIR secret is not set. See the header of this workflow."
            exit 1
          fi
          mkdir -p ~/.config/solana
          printf '%s' "$SOLANA_KEYPAIR" > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json
          solana config set --url devnet
          solana address
          solana balance

      - name: Try the devnet faucet (best effort)
        # The public faucet is rate-limited per IP, and a runner is a different IP
        # than a laptop, so this occasionally just works. It is deliberately
        # best-effort: if it fails, the funding preflight below reports the
        # address and the exact amount instead of letting the deploy fail with
        # "insufficient funds" three steps later.
        run: |
          set +e
          for i in 1 2 3; do
            solana airdrop 2 --url devnet && break
            sleep 5
          done
          solana balance || true

      - name: Place the committed program keypair
        # In that order, and NOT `anchor keys sync`: the id is committed and
        # fixed, so syncing would generate a new random address and silently
        # change which program this deployment is about.
        run: |
          mkdir -p target/deploy
          cp programs/owed/owed-keypair.json target/deploy/owed-keypair.json

      - name: Build for SBF
        # Anchor's default. It emits an SBPFv0 ELF (measured via e_flags in the
        # CI job's inspection step — despite Anchor docs claiming v3 defaults).
        # That is what devnet accepts today: with disable_sbpf_v0_execution not
        # yet activated, devnet's loader range is v0..=v3. A gate-full LOCAL
        # validator is the only thing that rejects v0 (it starts with every gate
        # active, so it accepts only v3); the CI settlement job deactivates that
        # one gate and documents the story. When SIMD-0500 lands (Agave 4.4),
        # the toolchain itself must move past v0.
        run: |
          anchor build
          ls -la target/deploy/owed.so

      - name: Assert every declared program id agrees
        run: |
          set -euo pipefail
          declared=$(sed -n 's/.*declare_id!("\([^"]*\)").*/\1/p' programs/owed/src/lib.rs | head -1)
          keypair=$(solana-keygen pubkey target/deploy/owed-keypair.json)
          toml=$(sed -n '/^\[programs\.devnet\]/,/^\[/p' Anchor.toml | sed -n 's/^owed *= *"\([^"]*\)".*/\1/p' | head -1)
          # Top-level in Anchor 0.31 (`Idl.address`); the older
          # `metadata.address` shape is accepted as a fallback.
          idl=$(node -e "const i=require('./target/idl/owed.json'); console.log(i.address ?? i.metadata?.address ?? '')")
          echo "declare_id! $declared | keypair $keypair | Anchor.toml $toml | IDL $idl"
          for v in "$keypair" "$toml" "$idl"; do
            [ "$v" = "$declared" ] || { echo "::error::program id disagreement: $v != $declared"; exit 1; }
          done

      - name: Check the wallet can pay for this deployment
        # Measured for the current artifact on 2026-09-22: 350,208 bytes, rent
        # 1.77993548 SOL for the ProgramData account, and the same again for the
        # buffer that carries it there (returned once the upgrade lands) — so
        # ~3.61 SOL, not the "a bit of SOL for fees" a reader would assume, and
        # not the ~5 SOL this comment guessed before a run measured it. Computed
        # from the artifact with `solana rent` and reported with the faucet URL,
        # because a silent "insufficient funds" costs an hour of guessing.
        run: |
          set -euo pipefail
          size=$(stat -c %s target/deploy/owed.so)
          per=$(solana rent $((size + 45)) | awk '/SOL/ {print $3; exit}')
          need=$(awk -v r="$per" 'BEGIN { printf "%.3f", 2*r + 0.05 }')
          have=$(solana balance | awk '{print $1}')
          address=$(solana address)
          echo "program ${size} bytes | rent ${per} SOL each | need ~${need} SOL | have ${have} SOL"
          if awk -v n="$need" -v h="$have" 'BEGIN { exit (h+0 >= n+0) ? 0 : 1 }'; then
            echo "funded"
          else
            {
              echo "::error::wallet $address holds ${have} SOL but this deployment needs ~${need} SOL on devnet"
              echo "::error::fund $address at https://faucet.solana.com (Devnet), then re-run this workflow"
            }
            exit 1
          fi

      - name: Deploy to devnet
        # `solana program deploy` with the committed program keypair, not
        # `anchor deploy`: identical to the command the CI settlement job proves
        # on every push, it does not rebuild, and --program-id pins the address
        # instead of letting Anchor mint a new one per run.
        run: |
          solana program deploy target/deploy/owed.so \
            --program-id target/deploy/owed-keypair.json \
            --url devnet 2>&1 | tee deploy.log
          grep -oE "Program Id: [A-Za-z0-9]+" deploy.log | tail -1 | tee /tmp/program-id.txt
          solana program show "$(solana-keygen pubkey target/deploy/owed-keypair.json)" --url devnet

      - name: Install test dependencies
        if: ${{ inputs.run_settlement_test }}
        run: npm install

      - name: Settle corporate actions end to end
        if: ${{ inputs.run_settlement_test }}
        # Needs a funded keypair for fees and account rent. This is the run that
        # prints the signatures the submission links to.
        #
        # Mocha directly, with the provider named explicitly. `npm test` would
        # panic with "ANCHOR_PROVIDER_URL not set" — AnchorProvider.env() reads
        # only that variable, and nothing else sets it here — and `anchor test`
        # would rebuild and redeploy, which this workflow has already done in
        # the steps above.
        # Retried as a whole file, not by mocha's --retries: the failure mode is
        # the public endpoint throttling a burst with 429s, which poisons a run
        # partway through and leaves the later tests cascading off missing state.
        # A fresh attempt rebuilds that state from scratch, and the backoff gives
        # the rate-limit window time to clear. The first dispatch died at the
        # second instruction and every subsequent test failed as a consequence.
        run: |
          set +e
          export ANCHOR_PROVIDER_URL=https://api.devnet.solana.com
          export ANCHOR_WALLET="$HOME/.config/solana/id.json"
          # Let the deploy's own traffic cool off before starting.
          sleep 20
          for attempt in 1 2 3; do
            echo "::group::settlement attempt $attempt"
            npx mocha --timeout 1000000 tests/**/*.mjs
            status=$?
            echo "::endgroup::"
            [ $status -eq 0 ] && exit 0
            echo "attempt $attempt failed (exit $status) — rate-limit backoff"
            sleep $((attempt * 60))
          done
          echo "::error::the settlement did not complete in 3 attempts"
          exit 1

      - name: Write the deployment record
        # The machine-readable outcome, so linking it in the README or the site is
        # a copy-paste rather than a scavenger hunt through logs. Uploaded below.
        if: always()
        run: |
          node -e "
            const { readFileSync, writeFileSync, existsSync } = require('node:fs');
            const out = { generatedAt: new Date().toISOString(), cluster: 'devnet' };
            try { out.programId = readFileSync('/tmp/program-id.txt','utf8').trim().replace('Program Id: ',''); } catch {}
            try {
              const r = JSON.parse(readFileSync('tests/settlement-report.json','utf8'));
              out.settlement = { steps: r.steps, actions: r.actions, holders: r.holders };
            } catch {}
            writeFileSync('devnet-deployment.json', JSON.stringify(out, null, 2));
            console.log(JSON.stringify(out, null, 2).slice(0, 600));
          " || echo 'no deployment record produced'

      - name: Upload the deployment record and settlement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devnet-deployment
          path: |
            devnet-deployment.json
            tests/settlement-report.json
          if-no-files-found: warn

      - name: Summarise
        run: |
          {
            echo "## Registry deployed to devnet"
            echo
            echo "Settlement test: ${{ inputs.run_settlement_test }}"
            echo
            if [ -f /tmp/program-id.txt ]; then
              echo "Program: $(cat /tmp/program-id.txt)"
              echo
              echo "Explorer: https://explorer.solana.com/address/$(cat /tmp/program-id.txt | sed 's/Program Id: //')?cluster=devnet"
              echo
            fi
            if [ -f tests/settlement-report.json ]; then
              echo "### Settlement signatures (devnet)"
              echo
              node -e "
                const r = require('./tests/settlement-report.json');
                for (const s of r.steps) {
                  if (s.rejected) console.log('- ' + s.label + ' — rejected (' + String(s.code).slice(0, 60) + ')');
                  else if (s.signature) console.log('- ' + s.label + ' — https://explorer.solana.com/tx/' + s.signature + '?cluster=devnet');
                }
              " || true
              echo
            fi
            echo '```'
            tail -40 deploy.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
