name: Deploy registry to devnet

# Manual only. This is the path to the one artifact still missing from the
# submission: a transaction signature from a real corporate action settled on
# devnet. It cannot be produced on Windows dev machines — there is no
# `cargo-build-sbf`, and the Solana toolchain is Linux/macOS only — so it runs
# here, where the toolchain works.
#
# One-time setup, which only the repository owner can do:
#
#   1. Create a funded devnet keypair and add its JSON as the repository secret
#      SOLANA_KEYPAIR (Settings → Secrets and variables → Actions).
#        solana-keygen new --outfile devnet.json
#        solana airdrop 2 --url devnet
#        # paste the contents of devnet.json as the secret value
#
#   2. Run this workflow. It builds, generates a real program id, deploys, and
#      then runs the end-to-end settlement test, printing explorer links in the
#      run summary.
#
# Nothing here runs on a push: deploying is a deliberate act.

on:
  workflow_dispatch:
    inputs:
      run_settlement_test:
        description: "Also run tests/owed.mjs (settles a 4:1 split end to end)"
        type: boolean
        default: true

jobs:
  deploy:
    name: Build, deploy, settle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor 0.31.2 (pinned prebuilt)
        run: |
          # Bare binary asset, and the repo moved: coral-xyz/anchor now
          # redirects to otter-sec/anchor.
          curl -sSfL -o anchor \
            https://github.com/otter-sec/anchor/releases/download/v0.31.2/anchor-0.31.2-x86_64-unknown-linux-gnu
          chmod +x anchor
          sudo mv anchor /usr/local/bin/anchor
          anchor --version

      - name: Restore wallet from SOLANA_KEYPAIR
        env:
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}
        run: |
          if [ -z "$SOLANA_KEYPAIR" ]; then
            echo "::error::SOLANA_KEYPAIR secret is not set. See the header of this workflow."
            exit 1
          fi
          mkdir -p ~/.config/solana
          printf '%s' "$SOLANA_KEYPAIR" > ~/.config/solana/id.json
          solana config set --url devnet
          solana address
          solana balance

      - name: Place the committed program keypair
        # In that order, and NOT `anchor keys sync`: the id is committed and
        # fixed, so syncing would generate a new random address and silently
        # change which program this deployment is about.
        run: |
          mkdir -p target/deploy
          cp programs/owed/owed-keypair.json target/deploy/owed-keypair.json

      - name: Build for SBF
        # Anchor's default, which emits SBPFv3. That is what devnet wants:
        # enable_sbpf_v1/v2/v3_deployment_and_execution are all active there
        # (verified 2026-09-22), and SIMD-0500 will make v3 the minimum. The
        # only cluster that rejects v3 is a gate-less local validator; the CI
        # settlement job activates the gates on its throwaway one and documents
        # the whole story.
        run: |
          anchor build
          ls -la target/deploy/owed.so

      - name: Assert every declared program id agrees
        run: |
          set -euo pipefail
          declared=$(sed -n 's/.*declare_id!("\([^"]*\)").*/\1/p' programs/owed/src/lib.rs | head -1)
          keypair=$(solana-keygen pubkey target/deploy/owed-keypair.json)
          toml=$(sed -n '/^\[programs\.devnet\]/,/^\[/p' Anchor.toml | sed -n 's/^owed *= *"\([^"]*\)".*/\1/p' | head -1)
          # Top-level in Anchor 0.31 (`Idl.address`); the older
          # `metadata.address` shape is accepted as a fallback.
          idl=$(node -e "const i=require('./target/idl/owed.json'); console.log(i.address ?? i.metadata?.address ?? '')")
          echo "declare_id! $declared | keypair $keypair | Anchor.toml $toml | IDL $idl"
          for v in "$keypair" "$toml" "$idl"; do
            [ "$v" = "$declared" ] || { echo "::error::program id disagreement: $v != $declared"; exit 1; }
          done

      - name: Deploy to devnet
        run: |
          anchor deploy --provider.cluster devnet 2>&1 | tee deploy.log
          grep -oE "Program Id: [A-Za-z0-9]+" deploy.log || true

      - name: Install test dependencies
        if: ${{ inputs.run_settlement_test }}
        run: npm install

      - name: Settle corporate actions end to end
        if: ${{ inputs.run_settlement_test }}
        # Needs a funded keypair for fees and account rent. This is the run that
        # prints the signatures the submission links to.
        #
        # Mocha directly, with the provider named explicitly. `npm test` would
        # panic with "ANCHOR_PROVIDER_URL not set" — AnchorProvider.env() reads
        # only that variable, and nothing else sets it here — and `anchor test`
        # would rebuild and redeploy, which this workflow has already done in
        # the steps above.
        run: |
          export ANCHOR_PROVIDER_URL=https://api.devnet.solana.com
          export ANCHOR_WALLET="$HOME/.config/solana/id.json"
          npx mocha --timeout 1000000 tests/**/*.mjs

      - name: Summarise
        run: |
          {
            echo "## Registry deployed to devnet"
            echo
            echo "Settlement test: ${{ inputs.run_settlement_test }}"
            echo
            echo '```'
            tail -40 deploy.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
