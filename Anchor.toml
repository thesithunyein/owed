# Anchor workspace config for the Owed registry.
#
# STATUS: the program has never been built. It shipped as a bare `src/lib.rs`
# with no crate around it, so no toolchain — Anchor, cargo, anything — could
# compile it. This file plus the Cargo manifests make it a real crate; whether it
# compiles is now answerable, and CI answers it.
#
# `owed` below is still the `anchor init` placeholder ID, which is itself proof it
# was never deployed. Run `anchor keys sync` to generate a real keypair and write
# the ID into both this file and `declare_id!`.

[toolchain]

[features]
resolution = true
skip-lint = false

# Both clusters use the same id, derived from the committed keypair at
# programs/owed/owed-keypair.json. Do not run `anchor keys sync` here: it would
# generate a new random id, and the address would stop referring to this program.
# CI asserts that these two, declare_id!, the target keypair, and the built IDL
# all agree before it executes anything.

[programs.localnet]
owed = "42WwVtPQzKiQRtDvaiGM7yjMw8jPSN1hxam24FcFFCLV"

[programs.devnet]
owed = "42WwVtPQzKiQRtDvaiGM7yjMw8jPSN1hxam24FcFFCLV"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
# The end-to-end test is plain ESM (.mjs) so it can import keeper/src/merkle.mjs
# directly — the same module verified against the Rust core by golden vectors.
#
# `npx`, not a bare `mocha`: Anchor runs this command through a plain shell that
# does not have node_modules/.bin on PATH, so the bare form dies with
# "bash: line 1: mocha: command not found" (exit 127) *after* the validator is
# up and the program is deployed — the most expensive possible place to fail.
# `npx` resolves the locally installed binary.
test = "npx mocha --timeout 1000000 tests/**/*.mjs"

[test]
# 30s, not the 5s this started at. On a cold CI runner the test validator takes
# far longer than 5s to answer, and `anchor test` gives up with "Unable to get
# latest blockhash. Test validator does not look started." rather than waiting.
# The settlement job is the only thing that runs this, and it is worth 30s.
startup_wait = 30000
shutdown_wait = 5000
# `upgradeable = false`: the settlement test asserts holder balances after a real
# action, and an upgradeable program adds a deploy-time authority check that has
# nothing to do with what is being tested.
upgradeable = false
